    name: McServerWebByKotlin

  # MySQL 数据源（本地需先创建库：CREATE DATABASE mc_server_list;）
  datasource:
    url: jdbc:mysql://localhost:3306/mc_server_list?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: hi58lo32
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 开发阶段自动建表/更新字段；生产环境建议改为 validate
      ddl-auto: update
